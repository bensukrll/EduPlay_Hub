<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ağ Kahramanı – Paketin Yolculuğu</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='games/unit3_level2/css/styles.css') }}">
</head>
<body>
    <div id="background-image"></div>
    

        <main class="main-content">
            <section class="game-section">


                <div class="game-layout">
                    <div class="card game-visual">
                        <div class="game-visual-badge">BT.5.3 &amp; BT.6.3</div>
                        <div class="game-visual-inner">
                            <div class="packet-avatar">📦</div>
                            <div class="game-visual-path">
                                <div class="node node-home">🏠</div>
                                <div class="path-line"></div>
                                <div class="node node-router">📡</div>
                                <div class="path-line"></div>
                                <div class="node node-cloud">☁️</div>
                            </div>
                            <p class="game-visual-text">
                                Paket; LAN, WLAN, WAN ve bulut üzerinden güvenli bir yolculuğa çıkıyor. Her adımda doğru cevabı vererek ağı keşfet!
                            </p>
                        </div>
                    </div>

                    <div class="card game-panel">
                        <div class="game-panel-content">
                            <div class="game-step-header">
                                <span id="stepSection" class="step-section-pill"></span>
                                <span id="stepCounter" class="step-counter"></span>
                            </div>

                            <h2 id="stepTitle" class="game-step-title"></h2>
                            <p id="stepStory" class="game-story"></p>

                            <div id="sequenceHint" class="sequence-hint" hidden>
                                👆 Bu soruda seçeneklere sırayla tıklayarak bir yol oluşturman gerekiyor. Yanlış olduysa "Sıfırla" butonuna basıp tekrar deneyebilirsin.
                            </div>

                            <div id="optionsContainer" class="options-container"></div>

                            <div id="sequenceOrder" class="sequence-order" hidden></div>

                            <div id="feedback" class="feedback"></div>
                        </div>
                        <div class="game-controls">
                            <button id="prevButton" class="btn btn-outline" type="button" disabled>
                                ← Önceki Soru
                            </button>
                            <button id="resetSequenceButton" class="btn btn-outline" type="button" hidden>
                                Sıralamayı Sıfırla
                            </button>
                            <button id="checkButton" class="btn btn-primary" type="button">
                                Cevabı Kontrol Et
                            </button>
                            <button id="nextButton" class="btn btn-success" type="button" disabled>
                                Sonraki Soru →
                            </button>
                        </div>

                        <div class="game-progress">
                            <div class="progress-bar-bg">
                                <div id="progressBar" class="progress-bar-fill"></div>
                            </div>
                            <span id="progressText" class="progress-text"></span>
                        </div>
                    </div>
                </div>
            </section>
        </main>

    <script     src="{{ url_for('static', filename='games/unit3_level2/js/game-network.js') }}"></script>
</body>
</html>
