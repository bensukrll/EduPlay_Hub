<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BT - Temel Bileşenler Kaçış Oyunu</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='games/unit1_level2/style.css') }}">
</head>
<body>


<div class="game-container" id="gameArea">

    <div class="timer-bar">
        Süre: <span id="time">40</span> sn
    </div>

    <!-- SÜRE GÖSTERGESİ -->
    <div class="timer">
        ⏱ Süre: <span id="time">30</span> sn
    </div>
    
    <div class="question-box" id="questionBox">
        <p id="question">Soru yükleniyor...</p>
        <div class="btn-group">
            <button class="yes" onclick="answer(true)">Doğru</button>
            <button class="no" onclick="answer(false)">Yanlış</button>
        </div>
    </div> 

<div class="game-container" id="gameArea">
    
    <div class="question-box" id="questionBox">
        <p id="question">Soru yükleniyor...</p>
        <div class="btn-group">
            <button class="yes" onclick="answer(true)">Doğru</button>
            <button class="no" onclick="answer(false)">Yanlış</button>
        </div>
    </div>

    <img src="{{ url_for('static', filename='games/unit1_level2/hero.png') }}" class="player" id="player">
    <img src="{{ url_for('static', filename='games/unit1_level2/monster.png') }}" class="monster" id="monster">
    <img src="{{ url_for('static', filename='games/unit1_level2/door.png') }}" class="door" id="door">


    <div class="start-screen" id="startScreen">
        <div class="screen-content">
            <h1>🎮 Kaçış Oyununa Hoş Geldin!</h1>
            <p>Soruları doğru bil, virüsten kaç ve sistemden çık!</p>
            <button class="start-btn" onclick="startGame()">OYUNU BAŞLAT</button>
        </div>
    </div>

</div>

<audio id="monsterRoar">
    <source src="data:audio/mp3;base64,//uQZAAA..." type="audio/mp3">
</audio>

<audio id="winSound">
    <source src="data:audio/mp3;base64,//uQZAAA..." type="audio/mp3">
</audio>

<script src="{{ url_for('static', filename='games/unit1_level2/script.js') }}"></script>

</body>
</html>
