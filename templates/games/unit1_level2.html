<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BT - Temel Bileşenler Kaçış Oyunu</title>
<style>
    body {
        margin: 0;
        background: #1e1e1e;
        font-family: Arial, sans-serif;
        color: #fff;
        overflow: hidden;
    }

    .game-container {
        width: 100%;
        height: 100vh;
        position: relative;
        background: linear-gradient(#111, #222);
    }

    @keyframes run {
        0% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
        100% { transform: translateY(0); }
    }

    @keyframes monsterRun {
        0%   { transform: translateY(0); }
        50%  { transform: translateY(-4px); }
        100% { transform: translateY(0); }
    }

    .player, .monster {
        animation-play-state: paused;
    }

    .player {
        width: 60px;
        height: 60px;
        background: #4CAF50;
        position: absolute;
        left: 120px;
        bottom: 40px;
        border-radius: 10px;
        transition: left 0.4s ease;
        animation: run 0.4s infinite;
    }

    .monster {
        width: 60px;
        height: 60px;
        background: red;
        position: absolute;
        left: 20px;
        bottom: 40px;
        border-radius: 10px;
        animation: monsterRun 0.5s infinite;
    }

    .door {
        width: 70px;
        height: 120px;
        background: gold;
        position: absolute;
        right: 20px;
        bottom: 20px;
        border-radius: 8px;
        border: 4px solid #fff;
    }

    .question-box {
        position: absolute;
        bottom: 0;
        width: 100%;
        background: #000000aa;
        padding: 20px;
        text-align: center;
        font-size: 20px;
        display: none;
    }

    button {
        padding: 10px 20px;
        margin: 10px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }

    .yes { background: #4CAF50; color: white; }
    .no { background: #e53935; color: white; }
    .start-btn { background: #2196F3; color: white; font-size: 26px; padding: 20px 40px; }

    .start-screen {
        position: absolute;
        top: 35%;
        width: 100%;
        text-align: center;
        font-size: 32px;
    }

    .game-over-box {
        position: absolute;
        top: 40%;
        width: 100%;
        text-align: center;
        font-size: 32px;
    }

    .restart-btn {
        background: #2196F3;
        color: #fff;
        padding: 15px 25px;
        font-size: 22px;
        border-radius: 10px;
        margin-top: 20px;
    }
</style>
</head>
<body>

<div class="game-container" id="gameArea">
    <div class="player" id="player"></div>
    <div class="monster" id="monster"></div>
    <div class="door"></div>

    <div class="start-screen" id="startScreen">
        <p>🎮 Kaçış Oyununa Hoş Geldin!</p>
        <button class="start-btn" onclick="startGame()">PLAY</button>
    </div>

    <div class="question-box" id="questionBox">
        <p id="question"></p>
        <button class="yes" onclick="answer(true)">Doğru</button>
        <button class="no" onclick="answer(false)">Yanlış</button>
    </div>
</div>

<div class="door" id="door"></div>

<audio id="monsterRoar">
    <source src="data:audio/mp3;base64,//uQZAAA..." type="audio/mp3">
</audio>

<audio id="winSound">
    <source src="data:audio/mp3;base64,//uQZAAA..." type="audio/mp3">
</audio>

<script>
    const questions = [
        { q: "CPU bilgisayarın işlemcisidir.", a: true },
        { q: "RAM kalıcı bir bellektir.", a: false },
        { q: "ROM sadece okunabilir bellektir.", a: true },
        { q: "SSD, HDD'den daha yavaştır.", a: false },
        { q: "Anakart tüm parçaları birbirine bağlar.", a: true },
        { q: "GPU grafik işlemlerini yapar.", a: true },
        { q: "Mouse bir çıkış birimidir.", a: false },
        { q: "Klavye giriş birimidir.", a: true },
        { q: "BIOS açılışta sistemi başlatır.", a: true },
        { q: "Monitör giriş birimidir.", a: false }
    ];

    let current = 0;
    let step = 95;
    let monsterSpeed = 1.2;
    let chaseInterval = null;

    const player = document.getElementById("player");
    const monster = document.getElementById("monster");
    const questionText = document.getElementById("question");
    const questionBox = document.getElementById("questionBox");
    const startScreen = document.getElementById("startScreen");

    const monsterRoar = document.getElementById("monsterRoar");
    const winSound = document.getElementById("winSound");

    questionText.innerText = questions[current].q;

    function startGame() {
        startScreen.style.display = "none";
        questionBox.style.display = "block";

        player.style.animationPlayState = "running";
        monster.style.animationPlayState = "running";

        startChase();
    }

    function startChase() {
        chaseInterval = setInterval(() => {
            let monsterPos = parseInt(monster.style.left || 20);
            let playerPos = parseInt(player.style.left);

            monster.style.left = (monsterPos + monsterSpeed) + "px";

            if (monsterPos + 40 >= playerPos) {
                monsterRoar.play();
                loseGame();
            }
        }, 50);
    }

    function answer(userAnswer) {

    if (userAnswer === questions[current].a) {

        wrongCount = 0; 
        current++;

        player.style.left = (120 + current * step) + "px";
        monsterSpeed += 0.2;

        if (current === questions.length) {
            questionBox.style.display = "none";
            escapeThroughDoor();
            return;
            }

        questionText.innerText = questions[current].q;
    }

    else {
        wrongCount++;

        let monsterPos = parseInt(monster.style.left || 20);
        monster.style.left = (monsterPos + 35) + "px";

        monsterRoar.play();

        if (wrongCount >= 3) {
            loseGame();
            }
        }
    }
    

    function loseGame() {
        clearInterval(chaseInterval);
        questionBox.style.display = "none";

        const msg = document.createElement("div");
        msg.className = "game-over-box";
        msg.innerHTML = `
            <p>❌ Canavar seni yakaladı!</p>
            <button class="restart-btn" onclick="restart()">Yeniden Oyna</button>
        `;
        document.getElementById("gameArea").appendChild(msg);

        monster.style.left = player.style.left;
    }

    function winGame() {
        clearInterval(chaseInterval);
        questionBox.style.display = "none";
        winSound.play();

        const msg = document.createElement("div");
        msg.className = "game-over-box";
        msg.innerHTML = `
            <p>🎉 Tebrikler! Tüm soruları bildin ve kaçtın!</p>
            <button class="restart-btn" onclick="restart()">Yeniden Oyna</button>
        `;
        document.getElementById("gameArea").appendChild(msg);
    }

    function restart() {
        location.reload();
    }
    function escapeThroughDoor() {
    clearInterval(chaseInterval);

    // Canavar dursun
    monster.style.animationPlayState = "paused";

    // Kapının konumu
    const door = document.getElementById("door");
    const doorLeft = door.offsetLeft + 10;

    // Oyuncu kapıya doğru yürüsün
    player.style.transition = "left 1s ease";
    player.style.left = doorLeft + "px";

    // Kapıya girince oyunu bitir
    setTimeout(() => {
        winGame();
    }, 1100);
}

</script>

</body>
</html>
