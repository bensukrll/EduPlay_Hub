<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>İç / Dış Donanım Eşleştirme</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='games/unit1__level1_game2/style.css') }}">
</head>

<body>

<h2>İç Donanım – Dış Donanım Eşleştirme</h2>

<div class="game">

  <div class="items" id="items">

    <!-- DIŞ DONANIM -->
    <div class="card" draggable="true" data-type="external">
      <img src="{{ url_for('static', filename='games/unit1__level1_game2/images/klavye.jpg') }}" alt="Klavye">
      <span>Klavye</span>
    </div>

    <div class="card" draggable="true" data-type="external">
      <img src="{{ url_for('static', filename='games/unit1__level1_game2/images/fare.jpg') }}" alt="Fare">
      <span>Fare</span>
    </div>

    <div class="card" draggable="true" data-type="external">
      <img src="{{ url_for('static', filename='games/unit1__level1_game2/images/yazici.jpg') }}" alt="Yazıcı">
      <span>Yazıcı</span>
    </div>

    <div class="card" draggable="true" data-type="external">
      <img src="{{ url_for('static', filename='games/unit1__level1_game2/images/hoparlor.jpg') }}" alt="Hoparlör">
      <span>Hoparlör</span>
    </div>

    <div class="card" draggable="true" data-type="external">
      <img src="{{ url_for('static', filename='games/unit1__level1_game2/images/webcam.jpg') }}" alt="Webcam">
      <span>Webcam</span>
    </div>

    <!-- İÇ DONANIM -->
    <div class="card" draggable="true" data-type="internal">
      <img src="{{ url_for('static', filename='games/unit1__level1_game2/images/ram.jpg') }}" alt="RAM">
      <span>RAM</span>
    </div>

    <div class="card" draggable="true" data-type="internal">
      <img src="{{ url_for('static', filename='games/unit1__level1_game2/images/islemci.jpg') }}" alt="İşlemci">
      <span>İşlemci</span>
    </div>

    <div class="card" draggable="true" data-type="internal">
      <img src="{{ url_for('static', filename='games/unit1__level1_game2/images/anakart.jpg') }}" alt="Anakart">
      <span>Anakart</span>
    </div>

    <div class="card" draggable="true" data-type="internal">
      <img src="{{ url_for('static', filename='games/unit1__level1_game2/images/ekran-karti.png') }}" alt="Ekran Kartı">
      <span>Ekran Kartı</span>
    </div>

    <div class="card" draggable="true" data-type="internal">
      <img src="{{ url_for('static', filename='games/unit1__level1_game2/images/ses-karti.jpg') }}" alt="Ses Kartı">
      <span>Ses Kartı</span>
    </div>

  </div>

  <div class="zones">
    <div class="zone">
      <h3>İç Donanım Birimleri</h3>
      <div class="drop-area" data-zone="internal"></div>
    </div>

    <div class="zone">
      <h3>Dış Donanım Birimleri</h3>
      <div class="drop-area" data-zone="external"></div>
    </div>
  </div>

</div>

<button id="checkBtn">Cevapları Gönder</button>
<button id="restartBtn">Yeniden Başlat</button>
<div class="result" id="result"></div>

    <script src="{{ url_for('static', filename='games/unit1__level1_game2/script.js') }}"></script>
</body>
</html>
