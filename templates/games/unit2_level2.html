<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilişim Etiği Labirenti</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='games/unit2_level2/style.css') }}">
</head>
<body>
<div class="game-wrapper">
    <div id="game-container">
        <div id="hud">
            <div class="hud-item">❤️ Can: <span id="lives">3</span></div>
            <div class="hud-item">⭐ Puan: <span id="score">0</span></div>
            <div class="hud-item">Seviye: <span id="level">1</span></div>
        </div>

        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <div id="question-panel">
            <h3 id="question-text">Soru yükleniyor...</h3>
            <div id="answers-hint">Doğru cevabın olduğu kapıya git!</div>
        </div>

        <div id="game-over-screen" class="hidden">
            <h1 id="game-over-title">Oyun Bitti!</h1>
            <p id="final-score">Puanın: 0</p>
            <button onclick="location.reload()">Tekrar Oyna</button>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='games/unit2_level2/script.js') }}"></script>
</body>
</html>
