<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sınıflandırma Oyunu - Unit 2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6fb;
            padding: 40px;
            color: #253156;
            text-align: center;
        }

        h2 { margin-bottom: 10px; }
        h3 { margin-bottom: 30px; }

        .container {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-bottom: 40px;
        }

        .box {
            width: 320px;
            min-height: 260px;
            padding: 20px;
            border-radius: 16px;
            border: 2px dashed #c0c6d8;
            background-color: #ffffff;
            font-size: 1.4rem;
            font-weight: bold;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }

        #safe { color: #2e7d32; }
        #unsafe { color: #c62828; }

        #items {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .item {
            background: #ffe066;
            color: #000;
            padding: 12px 16px;
            border-radius: 10px;
            margin: 12px 0;
            cursor: grab;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
            width: 100%;
            box-sizing: border-box;
        }

        .item:active { cursor: grabbing; }

        #resultBox {
            max-width: 500px;
            margin: 40px auto 0;
            padding: 25px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            display: none;
        }

        .note { text-align: center; margin: 10px auto 30px; color: #666; }
        
        button {
            padding: 10px 20px;
            background: #253156;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <h2>Aşağıdaki internet davranışlarını <strong>güvenli</strong> ve <strong>güvensiz</strong> olarak kutucuklara sürükleyiniz.</h2>
    <p class="note">NOT: Doğru yerleşim yeşil, yanlış yerleşim kırmızı renkte görünür.</p>

    <h3>🎯 Puan: <span id="score">0</span></h3>

    <div class="container">
        <div class="box" id="safe">✔ Güvenli</div>
        <div class="box" id="unsafe">❌ Güvensiz</div>
    </div>

    <div id="items"></div>

    <div id="resultBox">
        <h4>🎉 Oyun Tamamlandı!</h4>
        <p id="finalScore"></p>
        <button onclick="location.reload()">Tekrar Başlat</button>
    </div>

    <script>
        const data = [
            { text: "Güçlü ve karmaşık şifreler kullanmak.", safe: true },
            { text: "Tanımadığımız kişilerden gelen mesajlardaki linklere tıklamak.", safe: false },
            { text: "İnternette paylaştığımız bilgilerin kalıcı olduğunu unutmamak.", safe: true },
            { text: "Kamera ve mikrofon erişimini her siteye onaylamak.", safe: false },
            { text: "Şüpheli bir durumla karşılaştığımızda güvendiğimiz bir yetişkine danışmak.", safe: true },
            { text: "Her uygulama için aynı şifreyi kullanmak.", safe: false },
            { text: "Lisanslı antivirüs yazılımları kullanmak.", safe: true },
            { text: "Web sitelerinin 'https' ile başladığını kontrol etmek.", safe: true }
        ];

        // Soruları karıştır (Randomize)
        data.sort(() => Math.random() - 0.5);

        let score = 0;
        let answeredCount = 0;
        const itemsDiv = document.getElementById("items");

        data.forEach((item, i) => {
            const div = document.createElement("div");
            div.className = "item";
            div.draggable = true;
            div.innerText = item.text;
            div.id = "item" + i;
            itemsDiv.appendChild(div);

            div.addEventListener("dragstart", e => {
                e.dataTransfer.setData("id", div.id);
            });
        });

        document.querySelectorAll(".box").forEach(box => {
            box.addEventListener("dragover", e => e.preventDefault());

            box.addEventListener("drop", e => {
                e.preventDefault();
                const id = e.dataTransfer.getData("id");
                const el = document.getElementById(id);
                if (!el) return;

                const index = id.replace("item", "");
                const isSafe = data[index].safe;

                const correct = 
                    (box.id === "safe" && isSafe) || 
                    (box.id === "unsafe" && !isSafe);

                if (correct) {
                    el.style.background = "#a5d6a7";
                    box.appendChild(el);
                    score++;
                    document.getElementById("score").innerText = score;
                } else {
                    el.style.background = "#ef9a9a";
                    // Yanlışsa 1 saniye sonra rengini eski haline getir
                    setTimeout(() => { 
                        if (el.parentNode === itemsDiv) el.style.background = "#ffe066"; 
                    }, 1000);
                }

                checkGameOver();
            });
        });

        function checkGameOver() {
            const placedItems = document.querySelectorAll(".box .item").length;
            if (placedItems === data.length) {
                const resultBox = document.getElementById("resultBox");
                document.getElementById("finalScore").innerText = "Toplam Puanınız: " + score + " / " + data.length;
                resultBox.style.display = "block";
            }
        }
    </script>
</body>
</html>
