<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>EduPlay Hub - Kaydol</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='log-reg.css') }}">
</head>

<body class="entrance-body">

<div class="entrance-wrapper">

    <!-- BACKGROUND -->
    <div class="circle circle-green"></div>
    <div class="circle circle-orange"></div>
    <div class="circle circle-blue"></div>
    <div class="circle circle-pink"></div>
    <div class="circle circle-small-pink"></div>
    <div class="circle circle-yellow"></div>

    <!-- TITLE -->
    <h1 class="entrance-title">EduPlay Hub</h1>
    <p class="sub-title">Bilişim Teknolojileri Oyun Dünyası</p>

    <!-- MONITOR -->
    <div class="monitor">
        <div class="monitor-frame">
            <div class="monitor-screen">

                <form method="POST" class="login-form">

                    <input
                        type="text"
                        name="username"
                        placeholder="Kullanıcı Adı"
                        required
                    >

                    <input
                        type="email"
                        name="email"
                        placeholder="E-posta Adresi"
                        required
                    >

                    <input
                        type="password"
                        name="password"
                        placeholder="Şifre (en az 6 karakter)"
                        required
                    >

                    <select name="role" id="roleSelect" required>
                        <option value="" disabled selected>Kullanıcı Türü Seç</option>
                        <option value="student">Öğrenci</option>
                        <option value="teacher">Öğretmen</option>
                    </select>

                    <select name="current_grade" id="gradeSelect" style="display: none;">
                        <option value="" disabled selected>Sınıf Düzeyi Seç</option>
                        <option value="5">5. Sınıf</option>
                        <option value="6">6. Sınıf</option>
                    </select>

                    <button class="start-button">
                        Kaydol
                    </button>

                    <p class="login-switch">
                        Zaten hesabın var mı?
                        <a href="{{ url_for('login') }}">Giriş yap</a>
                    </p>

                </form>

            </div>
        </div>
        <div class="monitor-led"></div>
        <div class="monitor-stand"></div>
        <div class="monitor-base"></div>
    </div>

        <p class="entrance-subtitle">
        ✨ Macerana devam etmek için kaydol! ✨
    </p>

</div>

    <script>
        const roleSelect = document.getElementById("roleSelect");
        const gradeSelect = document.getElementById("gradeSelect");

        roleSelect.addEventListener("change", function () {
            if (roleSelect.value === "student") {
                gradeSelect.style.display = "block";
                gradeSelect.required = true;
            } else {
                gradeSelect.style.display = "none";
                gradeSelect.required = false;
                gradeSelect.value = "";
            }
        });
    </script>

</body>
</html>
