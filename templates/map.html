<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Map System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='map.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="map">
    </div>

    <header class="top-bar">
        <div class="top-bar-inner">
            <div class="logo-text">EduPlay Hub</div>
            <nav class="top-nav">

        </div>
        
                <div class="header-waves">


    <!-- 🌈 WAVE GRADIENT – MOR GÜÇLÜ -->
    <svg width="0" height="0" aria-hidden="true">
        <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <!-- SOĞUK, NET MOR -->
        <stop offset="0%" stop-color="#5b21b6"/>
        <stop offset="32%" stop-color="#6d28d9"/>

        <!-- KIRMIZI (DAHA GEÇ BAŞLIYOR) -->
        <stop offset="56%" stop-color="#d72638"/>

        <!-- TURUNCU -->
        <stop offset="80%" stop-color="#ff9f1c"/>
        <stop offset="100%" stop-color="#ff7a00"/>
    </linearGradient>


        </defs>
    </svg>

        <!-- WAVE 1 (en üst, en yumuşak) -->
<svg viewBox="0 0 1440 320" class="wave wave1" preserveAspectRatio="none" style="opacity: 0.3;">
    <path fill="url(#waveGradient)" d="M0,192L48,176C96,160,192,128,288,128C384,128,480,160,576,181.3C672,203,768,213,864,192C960,171,1056,117,1152,101.3C1248,85,1344,107,1392,117.3L1440,128L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z"></path>
</svg>


        <!-- WAVE 2 (orta katman) -->
<svg viewBox="0 0 1440 320" class="wave wave2" preserveAspectRatio="none" style="opacity: 0.6;">
    <path fill="url(#waveGradient)" d="M0,160L60,170.7C120,181,240,203,360,186.7C480,171,600,117,720,117.3C840,117,960,171,1080,181.3C1200,192,1320,160,1380,144L1440,128L1440,0L1380,0C1320,0,1200,0,1080,0C960,0,840,0,720,0C600,0,480,0,360,0C240,0,120,0,60,0L0,0Z"></path>
</svg>

        <!-- WAVE 3 (en alt, daha belirgin) -->
<svg viewBox="0 0 1440 320" class="wave wave3" preserveAspectRatio="none">
    <path fill="url(#waveGradient)" d="M0,128L80,117.3C160,107,320,85,480,112C640,139,800,213,960,218.7C1120,224,1280,160,1360,128L1440,96L1440,0L1360,0C1280,0,1120,0,960,0C800,0,640,0,480,0C320,0,160,0,80,0L0,0Z"></path>
</svg>



    </div>
    </header>

    <div class="ui-layer">
        <div class="left-panel">

        </div>
        <div class="right-panel">

        </div>
    </div>

    <div class="button-row">
    
    <button class="game-level-btn" id="level1-btn"  >
        <span class="base-layer">
        <span class="top-layer">1</span>
        </span>
    </button>

    <button class="game-level-btn" id="level2-btn" >
        <span class="base-layer">

    </button>

    <button class="game-level-btn" id="level3-btn" >
        <span class="base-layer">
        <span class="top-layer">3</span>
        </span>
    </button>

    </div>

</body>
