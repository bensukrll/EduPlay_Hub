<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>EduPlay Hub – İletişim</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='contact.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
<div class="page">

    <header class="top-bar">
        <div class="top-bar-inner">
            <div class="logo-text">EduPlay Hub</div>
            <nav class="top-nav">
                <a href="{{ url_for('home') }}" class="nav-link">Ana Sayfa</a>
                <a href="{{ url_for('about') }}" class="nav-link">Hakkımızda</a>
                <a href="{{ url_for('contact') }}" class="nav-link">İletişim</a>
            </nav>
        </div>
    </header>

    <main class="main">

        <section class="section">

            <div class="section-title">
                <span class="section-label">Bize Ulaş</span>
                <h1>İletişim</h1>
                <p class="contact-desc">
                    Görüş, öneri veya soruların için bize mesaj bırakabilirsin.
                </p>
            </div>

            <div class="card contact-card">

                {% if success %}
                <p class="contact-success">Mesajınız başarıyla gönderildi.</p>
                {% endif %}

                <form method="POST" class="contact-form">

                    <div class="form-group">
                        <label>Ad Soyad</label>
                        <input type="text" name="name" placeholder="Adınızı ve soyadınızı girin" required>
                    </div>

                    <div class="form-group">
                        <label>E-posta</label>
                        <input type="email" name="email" placeholder="ornek@mail.com" required>
                    </div>

                    <div class="form-group">
                        <label>Mesaj</label>
                        <textarea name="message" rows="4" placeholder="Mesajınızı buraya yazın..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-blue full contact-btn">
                        Gönder
                    </button>

                </form>
            </div>

        </section>
    </main>

    <footer class="bottom-bar">
        <div class="bottom-inner">
            <span>💻 Bilişim Teknolojileri · 5–6. Sınıf</span>
            <span>© 2025 EduPlay Hub</span>
        </div>
    </footer>

</div>
</body>
</html>
