<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPlay Hub – Oyun</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style-game.css') }}">
</head>

<body>
<div class="page">

<header class="new-top-bar">

    <div class="top-left">
        <a href="
        {% if source == 'ilkokul' %}
            {{ url_for('ilkokul') }}
        {% elif source == 'ortaokul' %}
            {{ url_for('ortaokul') }}
        {% else %}
            {{ url_for('home') }}
        {% endif %}
        " class="back-btn">
            ← Geri Dön
        </a>
    </div>

    <div class="top-center">
        <div class="unit-icon"><i class="fa-solid fa-laptop-code"></i></div>
        <div class="unit-info">
            <h1>{{ game.level }} · {{ game.unit }}</h1>
            <span>{{ game.subtitle }}</span>
        </div>
    </div>

    <div class="top-right">
        <a class="icon-btn"
           href="
           {% if source == 'ortaokul' %}
               {{ url_for('ortaokul') }}
           {% elif source == 'ilkokul' %}
               {{ url_for('ilkokul') }}
           {% else %}
               {{ url_for('home') }}
           {% endif %}
           ">
            <i class="fa-solid fa-gamepad"></i>
        </a>

        <a class="icon-btn" href="{{ url_for('home') }}">
            <i class="fa-solid fa-house"></i>
        </a>
    </div>

</header>

<main class="game-wrapper">
    <div class="game-box">

        <div class="game-box-header">
            <div class="header-left">
                <div class="game-icon">{{ game.icon }}</div>
                <div class="game-header-text">
                    <h2>{{ game.title }}</h2>
                    <p class="game-subtitle">{{ game.subtitle }}</p>
                </div>
            </div>
        </div>

        <div class="game-display-container">
            <iframe
                src="{{ url_for('embed', game_id=game_id) }}"
                class="game-iframe"
                allowfullscreen>
            </iframe>
        </div>

    </div>
</main>

<footer class="game-footer">
    <div class="footer-inner">
        <span>💻 Bilişim Teknolojileri · İlkokul - Ortaokul</span>
        <span>© 2025 EduPlay Hub</span>
    </div>
</footer>

</div>
</body>
</html>
