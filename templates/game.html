<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPlay Hub – Oyun</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style-game.css') }}">
</head>

<body>
<div class="page">

<header class="new-top-bar">
    <div class="top-left">
        <a href="{{ url_for('home') }}" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Geri Dön
        </a>
    </div>

    <div class="top-center">
        <div class="unit-icon"><i class="fa-solid fa-laptop-code"></i></div>
        <div class="unit-info">
            <h1>Ünite 1: Programlama ve Kodlama</h1>
            <span>Ortaokul Seviyesi - Algoritma ve blok tabanlı kodlama 🚀</span>
        </div>
    </div>

    <div class="top-right">
        <button class="icon-btn" onclick="window.location.href='/ortaokul'">
            <i class="fa-solid fa-gamepad"></i>
        </button>
        <button class="icon-btn" onclick="window.location.href='/'">
            <i class="fa-solid fa-house"></i>
        </button>
    </div>
</header>

<main class="game-wrapper">
    <div class="game-box">

        <div class="game-box-header">
            <div class="header-left">
                <div class="game-icon">🎯</div>
                <div>
                    <h2>Oyun Başlığı</h2>
                    <small>Görevini tamamla ve puanları topla!</small>
                </div>
            </div>
        </div>

        <div class="game-display-container">
            <iframe
                src="{{ url_for('embed', game_id=game_id) }}"
                class="game-iframe"
                allowfullscreen>
            </iframe>
        </div>

    </div>
</main>

<footer class="game-footer">
    <div class="footer-inner">
        <span>💻 Bilişim Teknolojileri · 5–6. Sınıf</span>
        <span>© 2025</span>
    </div>
</footer>

</div>
</body>
</html>
