<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPlay Hub – Oyun</title>

    <!-- ICONS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- STYLES -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style-game.css') }}">
</head>

<body>
<div class="page">

<!-- =============================
     TOP BAR
============================= -->
<header class="new-top-bar">

<!-- SOL -->
<div class="top-left">
    <a href="{{ url_for('map_page', level=level, unit=unit) }}" class="back-btn">
        ← Geri Dön
    </a>
</div>
    <!-- ORTA --> 
    <div class="top-center">
            <div class="unit-icon"><i class="fa-solid fa-laptop-code"></i></div>
            <div class="unit-info">
                <h1>{{ game.level }} · {{ game.unit }}</h1>
                <span class="subtitle">{{ game_description }}</span>
            </div>
    </div>

    <!-- SAĞ -->
    <div class="top-right">
        <a class="icon-btn"
           data-tooltip="Oyun Listesine Dön"
           href="
           {% if source == 'ortaokul' %}
               {{ url_for('ortaokul') }}
           {% elif source == 'ilkokul' %}
               {{ url_for('ilkokul') }}
           {% else %}
               {{ url_for('home') }}
           {% endif %}
           ">
            <i class="fa-solid fa-gamepad"></i>
        </a>

        <a class="icon-btn"
           data-tooltip="Ana Sayfaya Git"
           href="{{ url_for('home') }}">
            <i class="fa-solid fa-house"></i>
        </a>
    </div>

</header>

<!-- =============================
     GAME AREA
============================= -->
<main class="game-wrapper">
    <div class="game-box">

        <!-- GAME HEADER -->
        <div class="game-box-header">
            <div class="header-left">
                <div class="game-icon">{{ game.icon }}</div>
                <div class="game-header-text">
                    <h2>{{ game.title }}</h2>
                    <p class="game-subtitle">{{ game.subtitle }}</p>
                </div>
            </div>
        </div>

        <!-- GAME IFRAME -->
        <div class="game-display-container">

            {% if how_to_play %}
            <div class="how-to-play-overlay" id="howToPlayOverlay">
                <div class="how-to-play-card">

                    <div class="how-to-play-icon">
                        🎮
                    </div>

                    <h2>Nasıl Oynanır?</h2>

                    <p>{{ how_to_play | replace('\n', '<br>') | safe }}</p>

                    <button class="how-to-play-start-btn" id="startGameOverlayBtn">
                        Oyuna Başla 🚀
                    </button>

                </div>
            </div>
            {% endif %}

<iframe 
    id="gameFrame"
    class="game-iframe"
    src="{{ url_for('embed', game_id=game_id) }}">
</iframe>

        </div>

    </div>
</main>

<!-- =============================
     FOOTER
============================= -->
<footer class="game-footer">
    <div class="footer-inner">
        <span>💻 Bilişim Teknolojileri · İlkokul - Ortaokul</span>
        <span>© 2025 EduPlay Hub</span>
    </div>
</footer>

</div>

    <script>
        const overlay = document.getElementById("howToPlayOverlay");
        const startBtn = document.getElementById("startGameOverlayBtn");

        if (startBtn && overlay) {
            startBtn.addEventListener("click", function () {
                overlay.style.display = "none";
            });
        }
    </script>
</body>
</html>
